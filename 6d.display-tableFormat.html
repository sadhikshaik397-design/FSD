<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Eligibility Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            width: 50%;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h1>Voter Eligibility Checker</h1>
    
    <script>
        // Ask user for Name and Age
        var name = prompt("Enter your name:");
        var age = prompt("Enter your age:");

        // Convert age to number
        age = Number(age);

        // Determine voter eligibility
        var eligibility = (age >= 18) ? "Eligible to Vote ✅" : "Not Eligible to Vote ❌";

        // Display the result in a table format
        if (name && !isNaN(age)) {
            document.write(`
                <table>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Voting Eligibility</th>
                    </tr>
                    <tr>
                        <td>${name}</td>
                        <td>${age}</td>
                        <td>${eligibility}</td>
                    </tr>
                </table>
            `);
        } else {
            document.write("<p style='color:red;'>Invalid input. Please refresh and enter valid details.</p>");
        }
    </script>

</body>
</html>
