<html>
<head>
<title>Internal JavaScript</title>
<script>

function sum()
{

	var a=prompt("enter a value");
	a=parseInt(a)
	var b=prompt("enter b value");
	b=parseInt(b)
	document.write("sum="+(a+b));


}
</script>
</head>
<body>
<button onclick="sum()">sum</button>
</body>
</html>

Using Input Field
<html>
<head>
<title>Internal JavaScript</title>
<script>

function sum()
{
a=parseInt(f1.value1.value)
b=parseInt(f1.value2.value)

alert(a+b)	

}
</script>
</head>
<body>
<form name="f1">
Enter A value:<input type="text" name="value1"><br>
Enter B value:<input type="text" name="value2"><br>
<button onclick="sum()">sum</button>
</body>
</html>
